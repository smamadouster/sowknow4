# Guardian HC v2.0 -- SOWKNOW4 Production Configuration
# Autonomous observability & self-healing agent
#
# Matches docker-compose.production.yml container names (sowknow-* prefix).

version: "2.0"

app:
  name: "SOWKNOW4 Legacy Knowledge Vault"
  compose_file: "/home/development/src/active/sowknow4/docker-compose.production.yml"

services:
  # --- Infrastructure ---

  - name: "postgres"
    container: "sowknow-postgres"
    health_check:
      type: tcp
      host: postgres
      port: 5432
    # P0 incident 2026-07-28: NEVER auto-restart Postgres. A slow query is not a
    # dead database — restarting kills every in-flight search connection and was
    # the direct cause of the search outage (100 restarts/day). Alert only.
    auto_heal:
      restart: false

  - name: "redis"
    container: "sowknow-redis"
    health_check:
      type: tcp
      host: redis
      port: 6379
    auto_heal:
      restart: true

  # --- Application ---

  - name: "backend"
    container: "sowknow-backend"
    health_check:
      type: http
      url: "http://backend:8000/api/v1/health"
      timeout: 15
    # P0 incident 2026-07-28: no auto-restart/rebuild. Guardian's own DNS
    # lookups intermittently fail (sentinel.stale_data "Temporary failure in
    # name resolution"), producing false-negative health checks — with
    # rebuild_on_failure it was REPLACING the backend every 2-3 minutes,
    # killing every in-flight search. Alert only; heal manually.
    auto_heal:
      restart: false
      rebuild_on_failure: false

  - name: "embed-server"
    container: "sowknow-embed-server"
    health_check:
      type: http
      url: "http://embed-server:8000/health"
      timeout: 15
    # 2026-07-28: rebuild removed — same false-positive DNS issue as backend.
    # Plain restart is safe here (stateless, requests fail over to replica 2).
    auto_heal:
      restart: true
      rebuild_on_failure: false
      # Torch model warmup after restart takes ~60-90s; the default 20s+10s
      # verify window misreads a loading server as a failed heal and burns
      # restart attempts (INC-20260802-001/002 flapped on this).
      verify_delay: 120
      verify_timeout: 15

  - name: "embed-server-2"
    container: "sowknow-embed-server-2"
    health_check:
      type: http
      url: "http://embed-server-2:8000/health"
      timeout: 15
    # 2026-07-30: never auto-restart on memory. The torch caching allocator
    # grows to the cgroup limit and stays there (working set ~100% is steady
    # state, not a leak) — a restart heals nothing and takes the replica
    # offline mid-search. It was restarted every patrol while undeclared.
    auto_heal:
      restart: false
      rebuild_on_failure: false
    # Same steady-state reason: a permanent ~100% memory reading is not
    # actionable — suppress the alert (readings still recorded for reports).
    memory:
      alert: false

  - name: "rerank-server"
    container: "sowknow-rerank-server"
    health_check:
      type: http
      url: "http://rerank-server:8000/health"
      timeout: 15
    # 2026-07-28: rebuild removed — same false-positive DNS issue. Rerank is
    # fail-open in search, a restart only degrades ranking briefly.
    auto_heal:
      restart: true
      rebuild_on_failure: false
      # Model server: same warmup rationale as embed-server.
      verify_delay: 90
      verify_timeout: 15

  - name: "celery-light"
    container: "sowknow-celery-light"
    health_check:
      type: container
    auto_heal:
      restart: true

  - name: "celery-heavy"
    container: "sowknow-celery-heavy"
    health_check:
      type: container
    auto_heal:
      restart: true
      rebuild_on_failure: false  # 2026-07-28: false-positive DNS heals were replacing containers

  - name: "celery-entities"
    container: "sowknow-celery-entities"
    health_check:
      type: container
    auto_heal:
      restart: true

  - name: "celery-articles"
    container: "sowknow-celery-articles"
    health_check:
      type: container
    auto_heal:
      restart: true

  - name: "celery-collections"
    container: "sowknow-celery-collections"
    health_check:
      type: container
    auto_heal:
      restart: true

  - name: "celery-beat"
    container: "sowknow-celery-beat"
    health_check:
      type: container
    auto_heal:
      restart: true

  - name: "frontend"
    container: "sowknow-frontend"
    health_check:
      type: http
      url: "http://frontend:3000/"
      timeout: 10
    auto_heal:
      restart: true
      rebuild_on_failure: false  # 2026-07-28: false-positive DNS heals were replacing containers

  - name: "telegram-bot"
    container: "sowknow-telegram-bot"
    health_check:
      type: container
    auto_heal:
      restart: true

alerts:
  # Flood control: identical alerts are sent at most once per this window;
  # repeats are counted and summarized on the next send. 0 disables.
  throttle_minutes: 30
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: "${GMAIL_SMTP_USER}"
    smtp_password: "${GMAIL_SMTP_PASSWORD}"
    from: "${GMAIL_SMTP_USER}"
    to: "smamadouster@gmail.com"

patrols:
  critical:
    interval: "2m"
    checks: [containers, api_health]
  standard:
    interval: "10m"
    checks: [containers, api_health, disk, memory, network_health, ollama_health, vps_load]
  deep:
    interval: "1h"
    checks: [containers, api_health, disk, memory, ssl, config_drift, network_health, ollama_health, vps_load]

disk:
  warning_threshold: 70
  critical_threshold: 85
  emergency_threshold: 90
  auto_clean:
    docker_prune: true
    log_max_size: "50M"

ssl:
  domains:
    - "sowknow.gollamtech.com"
  auto_renew: true
  warning_days: 14
  critical_days: 3

celery:
  redis_host: "redis"
  redis_port: 6379
  redis_password: "${REDIS_PASSWORD}"
  max_queue_depth: 200
  worker_container: "sowknow-celery-light"
  beat_container: "sowknow-celery-beat"

ollama:
  enabled: false  # Ollama removed from project -- confidential routing uses metadata-only approach
  url: "http://host.docker.internal:11434"

vps_load:
  load_threshold: 6.0
  steal_threshold: 30.0  # was 20.0: shared-VPS steal hovers 17-27% (noisy neighbor, not fixable from inside); 30 still catches pathological cases
  # 2026-08-04: do not open a vps_load incident (and page Telegram) until the
  # condition has been sustained this long — steal/load flaps every patrol on
  # this shared VPS and generated open+resolved incidents all day.
  sustain_seconds: 600

# Docker network health -- detects stale nftables rules from dead bridges
network:
  probe_pairs:
    - from: "sowknow-backend"
      to_host: "redis"
      to_port: 6379
    - from: "sowknow-backend"
      to_host: "postgres"
      to_port: 5432

dashboard:
  port: 9090

# --- v2: Plugin System ---

plugins:
  infrastructure:
    enabled: true
  probes:
    enabled: true
    service_account:
      username: "guardian-probe@sowknow.local"
      password: "${GUARDIAN_PROBE_PASSWORD}"
    admin_account:
      username: "admin@sowknow.local"
      password: "${ADMIN_PASSWORD}"
  sentinel:
    enabled: true
  trends:
    enabled: true
    retention_raw: "48h"
    retention_hourly: "14d"
  memory:
    enabled: true
    bootstrap_sources:
      - "/var/docker/sowknow4/.wolf/buglog.json"
      - "/var/docker/sowknow4/logs/incidents.jsonl"

modules:
  - name: "Authentication Service"
    services: [backend]
    probes: [jwt_validity, auth_flow, admin_auth_flow]
  - name: "Document Pipeline"
    services: [celery-heavy, celery-light, embed-server, backend]
    probes: [embedding_pipeline, celery_completion]
  - name: "Search & Retrieval"
    services: [backend, rerank-server, postgres]
    probes: [query_latency]
  - name: "Collections Engine"
    services: [celery-collections, backend]
    probes: [celery_completion]
  - name: "Chat / LLM Service"
    services: [backend]
    probes: [llm_connectivity]
  - name: "Telegram Bot"
    services: [telegram-bot]
    probes: [bot_responsiveness]
  - name: "Storage Layer"
    services: [postgres, redis]
    probes: [redis_deep, postgres_deep]
  - name: "Infrastructure"
    services: [frontend, backend]
    probes: [disk, memory, network, ssl, resource_hogs]

database:
  host: "postgres"
  port: 5432
  dbname: "sowknow"
  user: "guardian"
  password: "${GUARDIAN_DB_PASSWORD}"
  fallback_sqlite: "/tmp/guardian-metrics-buffer.db"

agents:
  - id: "GA-0"
    name: "Watcher"
    role: "monitor"
    plugins: [probes, sentinel]
  - id: "GA-1"
    name: "Healer"
    role: "heal-executor"
  - id: "GA-2"
    name: "Debugger"
    role: "correlator"
  - id: "GA-3"
    name: "Learner"
    role: "learning"
    plugins: [memory]
  - id: "GA-4"
    name: "Reporter"
    role: "reporting"
  - id: "GA-5"
    name: "Archivist"
    role: "metrics"
    plugins: [trends]

runbooks_dir: "/app/runbooks"

daily_report:
  time: "06:00"
  timezone: "America/Toronto"
  channels: [telegram, email]
